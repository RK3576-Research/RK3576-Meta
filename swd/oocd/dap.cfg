# Enumerate the RK3576 debug port once it answers.
#
# `dap info` needs a current target and aborts with "current_target out of
# bounds" without one, which looks like a failure but is not. These commands
# query the DAP directly instead.
if { ![info exists SPEED] } { set SPEED 500 }
source [find [file join [file dirname [info script]] tigard-swd.cfg]]
transport select swd
adapter speed $SPEED
set _CHIPNAME rk3576
swd newdap $_CHIPNAME cpu -expected-id 0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
init

echo "=================== DP IS UP ==================="
# DPIDR is DP register 0
if { [catch { set id [$_CHIPNAME.dap dpreg 0] } e] } {
    echo "dpreg 0 failed: $e"
} else {
    echo "DPIDR = $id"
}
foreach ap {0 1 2 3 4 5 6 7} {
    if { [catch { set apid [$_CHIPNAME.dap apid $ap] } e] } {
        continue
    }
    if { $apid != 0 } { echo "AP $ap IDR = $apid" }
}
shutdown
