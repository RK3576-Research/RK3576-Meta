# Read memory over the RK3576 AHB MEM-AP.
#
# AP 0 is a MEM-AP (IDR 0x24770002, type 2 = AMBA AHB), so a `mem_ap` target
# gives mdw/mdb and dump_image without needing a CPU target defined -- which
# matters here, because the A-cores are not what this debug port attaches to.
#
# Requires the sdmmc/jtag auto-switch to be OFF; see hardware/JTAG_RESEARCH.md.
if { ![info exists SPEED] } { set SPEED 500 }
source [find [file join [file dirname [info script]] tigard-swd.cfg]]
transport select swd
adapter speed $SPEED
set _CHIPNAME rk3576
swd newdap $_CHIPNAME cpu -expected-id 0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.ap mem_ap -dap $_CHIPNAME.dap -ap-num 0
init
