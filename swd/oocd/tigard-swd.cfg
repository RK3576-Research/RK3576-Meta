# Tigard V1.1 in SWD mode.
#
# OpenOCD's stock interface/ftdi/tigard.cfg only declares nTRST/nSRST, so
# `transport select swd` fails with "SWD mode is not supported by the adapter".
# The ftdi driver needs SWD_EN (and optionally SWDIO_OE) declared before it
# will offer SWD.
#
# Tigard combines DI and DO to create SWDIO, and switches pin 2 of the CORTEX
# header between TMS and SWDIO. Both are done by the board's MODE SWITCH, which
# must be in the SWD position -- see hardware/JTAG_RUNS.txt, correction to run
# 0029. With the switch in JTAG, DI and DO are not combined and pin 2 is TMS,
# so SWDIO is simply absent and OpenOCD reports "cannot read IDR".
#
# Direction is handled in hardware, so there is no GPIO to drive and both
# signals are declared as always-asserted constants.
#
# Wiring, with the switch in SWD: board TCK -> pin 4, board TMS -> pin 2,
# GND -> GND. That is the ARM Cortex Debug pinout (pin 2 SWDIO/TMS, pin 4
# SWCLK/TCK).

adapter driver ftdi

ftdi device_desc "Tigard V1.1"
ftdi vid_pid 0x0403 0x6010

# Channel B (0-indexed: 1) carries the JTAG/SWD header on Tigard.
ftdi channel 1

ftdi layout_init 0x0038 0x003b
ftdi layout_signal nTRST -data 0x0010
ftdi layout_signal nSRST -data 0x0020

# Always-on constants: the hardware handles SWDIO direction.
ftdi layout_signal SWD_EN   -data 0x0000
ftdi layout_signal SWDIO_OE -data 0x0000

reset_config srst_push_pull trst_push_pull
